<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basketball Hub</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="nav">
    </div>
    <h2>Matches</h2>
    <div id="fixtures"></div>

    <script src="_common.js"></script>
    <script>
        document.getElementById('nav').innerHTML = navBar('home');
        bindLogout();

        (async() => {
            try {
                const fx = await (await fetch('/api/matches')).json();
                document.getElementById('fixtures').innerHTML =
                    (fx || []).map(m => `
            <div>
              <span>${new Date(m.tipoff_at).toLocaleString()}</span>
              <span>${m.home_name} vs ${m.away_name}</span>
              <span>@ ${m.venue || '-'}</span>
              <span>[${m.status}]</span>
              <span>${m.home_score}:${m.away_score}</span>
            </div>
          `).join('') || '<em style="text-align:center; display:block;">No fixtures</em>';
            } catch (err) {
                document.getElementById('fixtures').innerHTML = `<em style="color:#c33;">Failed to load fixtures</em>`;
            }
        })();
    </script>
</body>

</html>
